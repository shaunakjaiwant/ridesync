ServerTokens Prod
ServerSignature Off

<Directory "/var/www/html/ridesync">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory "/var/www/html/ridesync/storage">
    Require all denied
</Directory>

<FilesMatch "(^\.env|\.ini$|\.log$|\.sql$|\.bak$|\.key$)">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
