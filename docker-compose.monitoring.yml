services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ridesync_prometheus:/prometheus
    secrets:
      - ridesync_metrics_token
    depends_on:
      - app
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ridesync_alertmanager:/alertmanager
    restart: unless-stopped

volumes:
  ridesync_prometheus:
  ridesync_alertmanager:

secrets:
  ridesync_metrics_token:
    environment: RIDESYNC_METRICS_TOKEN
