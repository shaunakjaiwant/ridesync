services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      RIDESYNC_ENV: production
      RIDESYNC_DEBUG: "false"
      RIDESYNC_TIMEZONE: ${RIDESYNC_TIMEZONE:-Asia/Kolkata}
      RIDESYNC_DB_HOST: mysql
      RIDESYNC_DB_PORT: 3306
      RIDESYNC_DB_NAME: ridesync_db
      RIDESYNC_DB_USER: ridesync_app
      RIDESYNC_DB_PASSWORD: ${RIDESYNC_DB_PASSWORD:?Set RIDESYNC_DB_PASSWORD before starting RideSync}
      RIDESYNC_DB_CONNECT_TIMEOUT: ${RIDESYNC_DB_CONNECT_TIMEOUT:-5}
      RIDESYNC_COOKIE_SECURE: "true"
      RIDESYNC_TRUST_PROXY: "true"
      RIDESYNC_SESSION_IDLE_SECONDS: ${RIDESYNC_SESSION_IDLE_SECONDS:-1800}
      RIDESYNC_SESSION_ABSOLUTE_SECONDS: ${RIDESYNC_SESSION_ABSOLUTE_SECONDS:-28800}
      RIDESYNC_SESSION_ROTATE_SECONDS: ${RIDESYNC_SESSION_ROTATE_SECONDS:-900}
      RIDESYNC_STORAGE_DIR: /var/www/html/ridesync/storage
      RIDESYNC_DOCUMENT_ENCRYPTION_KEY: ${RIDESYNC_DOCUMENT_ENCRYPTION_KEY:?Set RIDESYNC_DOCUMENT_ENCRYPTION_KEY before starting RideSync}
      RIDESYNC_REPAIR_LOG_KEY: ${RIDESYNC_REPAIR_LOG_KEY:?Set RIDESYNC_REPAIR_LOG_KEY before starting RideSync}
      RIDESYNC_METRICS_TOKEN: ${RIDESYNC_METRICS_TOKEN:?Set RIDESYNC_METRICS_TOKEN before starting RideSync}
      RIDESYNC_VERIFICATION_SERVICE_URL: http://ai-verification:8011
      RIDESYNC_VERIFICATION_SERVICE_TOKEN: ${RIDESYNC_VERIFICATION_SERVICE_TOKEN:?Set RIDESYNC_VERIFICATION_SERVICE_TOKEN before starting RideSync}
      RIDESYNC_KYC_PROVIDER: ${RIDESYNC_KYC_PROVIDER:-mock_compliance_provider}
      RIDESYNC_VERIFICATION_ASYNC: "true"
      RIDESYNC_VERIFICATION_INLINE_FALLBACK: "false"
      RIDESYNC_REDIS_URL: redis://redis:6379/2
      RIDESYNC_WEBSOCKET_URL: ${RIDESYNC_WEBSOCKET_URL:?Set RIDESYNC_WEBSOCKET_URL before starting RideSync}
      RIDESYNC_WS_SHARED_TOKEN: ${RIDESYNC_WS_SHARED_TOKEN:?Set RIDESYNC_WS_SHARED_TOKEN before starting RideSync}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ai-verification:
        condition: service_started
    volumes:
      - ridesync_storage:/var/www/html/ridesync/storage
      - ridesync_uploads:/var/www/html/ridesync/uploads
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "tools/queue_worker.php", "--watch", "--queue=verification", "--limit=10", "--sleep=2"]
    environment:
      RIDESYNC_ENV: production
      RIDESYNC_DEBUG: "false"
      RIDESYNC_TIMEZONE: ${RIDESYNC_TIMEZONE:-Asia/Kolkata}
      RIDESYNC_DB_HOST: mysql
      RIDESYNC_DB_PORT: 3306
      RIDESYNC_DB_NAME: ridesync_db
      RIDESYNC_DB_USER: ridesync_app
      RIDESYNC_DB_PASSWORD: ${RIDESYNC_DB_PASSWORD:?Set RIDESYNC_DB_PASSWORD before starting RideSync}
      RIDESYNC_DB_CONNECT_TIMEOUT: ${RIDESYNC_DB_CONNECT_TIMEOUT:-5}
      RIDESYNC_STORAGE_DIR: /var/www/html/ridesync/storage
      RIDESYNC_DOCUMENT_ENCRYPTION_KEY: ${RIDESYNC_DOCUMENT_ENCRYPTION_KEY:?Set RIDESYNC_DOCUMENT_ENCRYPTION_KEY before starting RideSync}
      RIDESYNC_REPAIR_LOG_KEY: ${RIDESYNC_REPAIR_LOG_KEY:?Set RIDESYNC_REPAIR_LOG_KEY before starting RideSync}
      RIDESYNC_VERIFICATION_SERVICE_URL: http://ai-verification:8011
      RIDESYNC_VERIFICATION_SERVICE_TOKEN: ${RIDESYNC_VERIFICATION_SERVICE_TOKEN:?Set RIDESYNC_VERIFICATION_SERVICE_TOKEN before starting RideSync}
      RIDESYNC_KYC_PROVIDER: ${RIDESYNC_KYC_PROVIDER:-mock_compliance_provider}
      RIDESYNC_REDIS_URL: redis://redis:6379/2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ai-verification:
        condition: service_started
    volumes:
      - ridesync_storage:/var/www/html/ridesync/storage
      - ridesync_uploads:/var/www/html/ridesync/uploads
    healthcheck:
      disable: true
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "tools/queue_worker.php", "--watch", "--queue=notifications", "--limit=50", "--sleep=2"]
    environment:
      RIDESYNC_ENV: production
      RIDESYNC_DEBUG: "false"
      RIDESYNC_TIMEZONE: ${RIDESYNC_TIMEZONE:-Asia/Kolkata}
      RIDESYNC_DB_HOST: mysql
      RIDESYNC_DB_PORT: 3306
      RIDESYNC_DB_NAME: ridesync_db
      RIDESYNC_DB_USER: ridesync_app
      RIDESYNC_DB_PASSWORD: ${RIDESYNC_DB_PASSWORD:?Set RIDESYNC_DB_PASSWORD before starting RideSync}
      RIDESYNC_DB_CONNECT_TIMEOUT: ${RIDESYNC_DB_CONNECT_TIMEOUT:-5}
      RIDESYNC_STORAGE_DIR: /var/www/html/ridesync/storage
      RIDESYNC_REDIS_URL: redis://redis:6379/2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ridesync_storage:/var/www/html/ridesync/storage
      - ridesync_uploads:/var/www/html/ridesync/uploads
    healthcheck:
      disable: true
    restart: unless-stopped

  websocket-gateway:
    build:
      context: ./realtime/websocket-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      RIDESYNC_WS_PORT: 8081
      RIDESYNC_WS_POLL_MS: ${RIDESYNC_WS_POLL_MS:-1500}
      RIDESYNC_WS_SHARED_TOKEN: ${RIDESYNC_WS_SHARED_TOKEN:?Set RIDESYNC_WS_SHARED_TOKEN before starting RideSync}
      RIDESYNC_DB_HOST: mysql
      RIDESYNC_DB_PORT: 3306
      RIDESYNC_DB_NAME: ridesync_db
      RIDESYNC_DB_USER: ridesync_app
      RIDESYNC_DB_PASSWORD: ${RIDESYNC_DB_PASSWORD:?Set RIDESYNC_DB_PASSWORD before starting RideSync}
      RIDESYNC_REDIS_URL: redis://redis:6379/2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  ai-verification:
    build:
      context: ./apps/ai-verification
      dockerfile: Dockerfile
    environment:
      RIDESYNC_ENV: production
      RIDESYNC_VERIFICATION_SERVICE_TOKEN: ${RIDESYNC_VERIFICATION_SERVICE_TOKEN:?Set RIDESYNC_VERIFICATION_SERVICE_TOKEN before starting RideSync}
      RIDESYNC_VERIFICATION_MAX_REQUEST_BYTES: ${RIDESYNC_VERIFICATION_MAX_REQUEST_BYTES:-2000000}
      RIDESYNC_VERIFICATION_MAX_FILE_BASE64_BYTES: ${RIDESYNC_VERIFICATION_MAX_FILE_BASE64_BYTES:-1500000}
      RIDESYNC_VERIFICATION_MAX_DOCUMENTS: ${RIDESYNC_VERIFICATION_MAX_DOCUMENTS:-12}
      RIDESYNC_VERIFICATION_OCR_TIMEOUT_SECONDS: ${RIDESYNC_VERIFICATION_OCR_TIMEOUT_SECONDS:-5}
      RIDESYNC_VERIFICATION_MAX_IMAGE_PIXELS: ${RIDESYNC_VERIFICATION_MAX_IMAGE_PIXELS:-12000000}
      RIDESYNC_KYC_PROVIDER: ${RIDESYNC_KYC_PROVIDER:-mock_compliance_provider}
      RIDESYNC_KYC_PROVIDER_URL: ${RIDESYNC_KYC_PROVIDER_URL:-}
      RIDESYNC_KYC_PROVIDER_TOKEN: ${RIDESYNC_KYC_PROVIDER_TOKEN:-}
      RIDESYNC_KYC_PROVIDER_TIMEOUT_SECONDS: ${RIDESYNC_KYC_PROVIDER_TIMEOUT_SECONDS:-6}
      RIDESYNC_REDIS_URL: redis://redis:6379/2
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ridesync_db
      MYSQL_USER: ridesync_app
      MYSQL_PASSWORD: ${RIDESYNC_DB_PASSWORD:?Set RIDESYNC_DB_PASSWORD before starting RideSync}
      MYSQL_ROOT_PASSWORD: ${RIDESYNC_DB_ROOT_PASSWORD:?Set RIDESYNC_DB_ROOT_PASSWORD before starting RideSync}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ridesync_mysql:/var/lib/mysql
      - ./database/ridesync_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ridesync_app -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ridesync_redis:/data
    restart: unless-stopped

volumes:
  ridesync_mysql:
  ridesync_redis:
  ridesync_storage:
  ridesync_uploads:
