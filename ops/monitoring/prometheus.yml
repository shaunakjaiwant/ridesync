global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ridesync-web
    metrics_path: /ridesync/api/metrics.php
    static_configs:
      - targets:
          - app:80
