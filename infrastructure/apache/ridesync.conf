ServerTokens Prod
ServerSignature Off

<Directory "/var/www/html/ridesync">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory "/var/www/html/ridesync/storage">
    Require all denied
</Directory>

<DirectoryMatch "^/var/www/html/ridesync/(\.|ai|apps|backend|config|database|docs|includes|infrastructure|realtime|tests|tools)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "(^\.|\.env$|\.env\.|\.ini$|\.log$|\.sql$|\.bak$|\.key$|^composer\.(json|lock)$|^package(-lock)?\.json$|^docker-compose.*\.ya?ml$|^Dockerfile$)">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header unset X-Powered-By
    Header always unset X-Powered-By
    Header unset X-Content-Type-Options
    Header always unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
    Header unset X-Frame-Options
    Header always unset X-Frame-Options
    Header always set X-Frame-Options "DENY"
    Header unset Referrer-Policy
    Header always unset Referrer-Policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
