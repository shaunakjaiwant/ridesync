name: RideSync Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ridesync_db
          MYSQL_USER: ridesync_app
          MYSQL_PASSWORD: ridesync_ci_password
          MYSQL_ROOT_PASSWORD: ridesync_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u ridesync_app -pridesync_ci_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      RIDESYNC_ENV: testing
      RIDESYNC_DEBUG: "false"
      RIDESYNC_TIMEZONE: Asia/Kolkata
      RIDESYNC_DB_HOST: 127.0.0.1
      RIDESYNC_DB_PORT: "3306"
      RIDESYNC_DB_NAME: ridesync_db
      RIDESYNC_DB_USER: ridesync_app
      RIDESYNC_DB_PASSWORD: ridesync_ci_password
      RIDESYNC_DB_ROOT_PASSWORD: ridesync_ci_root_password
      RIDESYNC_DOCUMENT_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      RIDESYNC_REPAIR_LOG_KEY: MjIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      RIDESYNC_METRICS_TOKEN: ridesync-ci-metrics-token-000000000000000000000000
      RIDESYNC_VERIFICATION_SERVICE_TOKEN: ridesync-ci-verification-token-000000000000000000
      RIDESYNC_WS_SHARED_TOKEN: ridesync-ci-websocket-token-000000000000000000000000000000
      RIDESYNC_WEBSOCKET_URL: ws://127.0.0.1:8081/ridesync/ws
      RIDESYNC_VERIFICATION_SERVICE_URL: http://127.0.0.1:8011
      RIDESYNC_REDIS_URL: redis://127.0.0.1:6379/2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, openssl, fileinfo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install system clients
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client

      - name: Install Node dependencies
        run: npm ci

      - name: Install AI verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r apps/ai-verification/requirements.txt

      - name: Load database schema and seed data
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pridesync_ci_root_password < database/ridesync_db.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pridesync_ci_root_password < database/seed_demo_data.sql
          php tools/apply_schema_upgrade.php

      - name: Run syntax quality gate
        run: php tools/quality_gate.php --syntax-only

      - name: Run DB bootstrap diagnostics
        run: php tools/db_bootstrap_check.php --required

      - name: Run full quality gate
        run: php tools/quality_gate.php

      - name: Run dependency audit
        run: npm audit --omit=dev
