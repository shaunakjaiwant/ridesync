name: Feature Request
description: Suggest an idea or enhancement for RideSync
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a feature for RideSync!
  - type: input
    id: feature_title
    attributes:
      label: Feature Title
      description: A concise title for your feature request.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or user pain point?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe what you want to happen and how it benefits transit users.
    validations:
      required: true
