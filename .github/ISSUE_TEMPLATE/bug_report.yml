name: Bug Report
description: Create a report to help us improve RideSync
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug in RideSync!
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the behavior.
      placeholder: |
        1. Go to '/ridesync/pages/search_rides.php'
        2. Enter 'SDMIT Campus' to 'Mangaluru'
        3. Click 'Search'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
